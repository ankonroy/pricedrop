name: Price checks

on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours (UTC)
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write             # needed to commit the updated DB back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
          EOF

      - name: Run price checks
        run: python -m worker.run_checks

      - name: Commit updated DB
        run: |
          git config user.name "pricedrop-bot"
          git config user.email "pricedrop-bot@users.noreply.github.com"
          git add data/prices.db
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "chore: update prices.db [skip ci]"
            git push
          fi